<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Διαχείριση Περιεχομένου — Operations Portal</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/shared.css">
<style>
  html,body{height:100%;}
  body{display:flex;flex-direction:column;}

  .top-bar{height:56px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);
    display:flex;align-items:center;padding:0 24px;gap:12px;}
  .top-bar strong{font-size:15px;}
  .top-bar .back-link{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--text-soft);text-decoration:none;
    border:1px solid var(--border);border-radius:4px;padding:4px 8px;}
  .top-bar .back-link:hover{background:var(--surface-2);color:var(--text);}

  .layout{flex:1;display:flex;min-height:0;}

  .sidebar{width:340px;flex-shrink:0;border-left:1px solid var(--border);background:var(--surface);
    display:flex;flex-direction:column;min-height:0;order:2;}
  .main{order:1;}
  .sidebar-section{padding:14px 16px;}
  .sidebar-section.grow{flex:1;overflow-y:auto;min-height:0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
  .label{font-size:11px;color:var(--text-soft);margin-bottom:8px;text-transform:uppercase;letter-spacing:.02em;}
  .label-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .label-row .label{margin-bottom:0;}
  .refresh-btn{border:none;background:none;color:var(--accent);font-size:11.5px;cursor:pointer;padding:0;
    text-transform:none;letter-spacing:0;}
  .refresh-btn:hover{text-decoration:underline;}

  .new-doc-btn{width:100%;border:none;background:var(--accent);color:var(--on-accent);
    border-radius:6px;padding:10px;font-size:13px;cursor:pointer;font-weight:600;}

  .filter-input, .search-input{width:100%;border:1px solid var(--border);border-radius:6px;
    padding:8px 10px;font-size:13px;margin-top:10px;}

  .doc-row{padding:9px 8px;border-radius:6px;cursor:pointer;margin-bottom:2px;}
  .doc-row:hover{background:var(--surface-2);}
  .doc-row.active{background:var(--accent-soft);}
  .doc-row-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .doc-row-top strong{font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .doc-time{font-size:11px;color:var(--text-soft);white-space:nowrap;flex-shrink:0;}
  .doc-row-preview{font-size:12px;color:var(--text-soft);margin-top:2px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .empty-note{font-size:12px;color:var(--text-soft);}

  .search-result-row{font-size:12.5px;padding:7px 6px;border-radius:6px;cursor:pointer;}
  .search-result-row:hover{background:var(--surface-2);}
  .search-result-row strong{display:block;color:var(--text);font-size:12.5px;}
  .search-result-row span{color:var(--text-soft);}

  .fallback-row{font-size:12.5px;padding:7px 6px;border-bottom:1px solid var(--border);color:var(--text);
    line-height:1.5;}
  .fallback-row:last-child{border-bottom:none;}
  .fq-time{font-size:11px;color:var(--text-soft);display:block;margin-top:2px;}

  .test-q{padding:14px 16px;flex-shrink:0;}
  .test-q input{width:100%;border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:12px;margin-top:4px;}
  .test-q-answer{font-size:12.5px;line-height:1.6;background:var(--surface-2);border:1px solid var(--border);
    border-radius:6px;padding:10px;margin-top:8px;}
  .test-q-answer.fallback{border-color:var(--warn-border);background:var(--warn-bg);}
  .test-q-meta{font-size:11px;color:var(--text-soft);margin-top:6px;}
  .test-q-details{margin-top:8px;}
  .test-q-details summary{font-size:11px;color:var(--text-soft);cursor:pointer;}
  .test-q-details pre{font-size:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;
    padding:8px;margin-top:6px;max-height:160px;overflow:auto;white-space:pre-wrap;word-break:break-word;}

  .main{flex:1;overflow-y:auto;padding:32px 40px;min-width:0;}
  .main-placeholder{color:var(--text-soft);font-size:14px;margin-top:60px;text-align:center;}

  .preview-head h2{font-size:22px;margin:0 0 6px;}
  .preview-meta{font-size:12.5px;color:var(--text-soft);margin-bottom:20px;}
  .preview-meta a{color:var(--accent);}
  .preview-body{font-size:14.5px;line-height:1.8;white-space:pre-wrap;max-width:760px;
    border:1px solid var(--border);border-radius:8px;padding:20px;background:var(--surface);}
  .preview-actions{margin-top:20px;display:flex;gap:10px;}
  .preview-actions button{border:none;background:var(--accent);color:var(--on-accent);
    border-radius:6px;padding:9px 18px;font-size:13px;cursor:pointer;font-weight:600;}

  .edit-form{display:flex;flex-direction:column;gap:8px;max-width:760px;}
  .form-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .form-header .label{margin-bottom:0;}
  .form-header button{border:none;background:none;color:var(--text-soft);font-size:12px;
    cursor:pointer;text-decoration:underline;}
  .edit-form input, .edit-form textarea{border:1px solid var(--border);border-radius:6px;
    padding:9px 10px;font-size:13.5px;width:100%;}
  .edit-form input:disabled{background:var(--surface-2);color:var(--text-soft);}
  .edit-form textarea{resize:vertical;min-height:380px;line-height:1.6;}
  .edit-form button[type="submit"]{border:none;background:var(--accent);color:var(--on-accent);
    border-radius:6px;padding:10px 18px;font-size:13px;cursor:pointer;align-self:flex-start;font-weight:600;}
  .edit-form button:disabled{opacity:.5;cursor:default;}
  .upload-status{font-size:12px;color:var(--text-soft);}

  .diff-view{display:none;flex-direction:column;gap:10px;max-width:760px;}
  .diff-view.show{display:flex;}
  .diff-text{font-size:13.5px;line-height:1.7;border:1px solid var(--border);
    border-radius:8px;padding:16px;background:var(--surface-2);white-space:pre-wrap;}
  .diff-text ins{background:rgba(62,107,87,.18);color:var(--text);text-decoration:none;border-radius:2px;}
  .diff-text del{background:rgba(163,64,47,.14);color:var(--text-soft);text-decoration:line-through;border-radius:2px;}
  .diff-actions{display:flex;gap:10px;}
  .diff-actions button{border:none;border-radius:6px;padding:10px 18px;font-size:13px;cursor:pointer;font-weight:600;}
  .diff-confirm{background:var(--accent);color:var(--on-accent);}
  .diff-back{background:none;border:1px solid var(--border) !important;color:var(--text);}
  .diff-nochange{font-size:13px;color:var(--text-soft);}

  .slug-hint{font-size:11.5px;color:var(--text-soft);margin-top:-2px;}
  .upload-limit-hint{font-size:11.5px;color:var(--text-soft);margin-top:-2px;}

  /* Σε στενές οθόνες, το sidebar (σταθερό πλάτος) σπρώχνει το main panel
     εκτός οθόνης -- εδώ το κύριο panel πάει ΚΑΤΩ από το sidebar αντί
     να εξαφανίζεται. */
  @media (max-width: 900px){
    .layout{flex-direction:column;}
    .sidebar{width:100%;border-left:none;border-bottom:1px solid var(--border);order:1;}
    .main{order:2;}
    .sidebar-section.grow{max-height:280px;}
    .main{padding:20px;}
  }
</style>
</head>
<body>

  <div class="top-bar">
    <strong>Διαχείριση Περιεχομένου</strong>
    <a class="back-link" href="/">←Portal</a>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-section">
        <button class="new-doc-btn" id="newDocBtn">+ Νέο έγγραφο</button>
        <input type="text" class="filter-input" id="docFilterInput" placeholder="Φίλτρο με τίτλο…">
      </div>
      <div class="sidebar-section grow">
        <div class="label">Έγγραφα</div>
        <div id="docList">Φόρτωση…</div>
      </div>
      <div class="sidebar-section">
        <div class="label">Βρες με περιγραφή</div>
        <input type="text" class="search-input" id="docSearchInput" placeholder="π.χ. τα ωράρια του Billing…">
        <div id="docSearchResults" style="margin-top:8px;"></div>
      </div>
      <div class="test-q">
        <div class="label">Δοκιμαστικό ερώτημα</div>
        <input type="text" id="testQInput" placeholder="π.χ. Ποιο είναι το όριο έγκρισης;">
        <div id="testQOutput"></div>
      </div>
      <div class="sidebar-section">
        <div class="label-row">
          <div class="label">Ερωτήσεις χωρίς απάντηση</div>
          <button type="button" class="refresh-btn" id="refreshFallbackBtn">↻ Ανανέωση</button>
        </div>
        <div id="fallbackList">Φόρτωση…</div>
      </div>
    </div>

    <div class="main" id="mainPanel">
      <div class="main-placeholder">Επίλεξε ένα έγγραφο από τα αριστερά, ή δημιούργησε νέο.</div>
    </div>
  </div>

<script src="/shared.js"></script>
<script>
  const el = (id) => document.getElementById(id);

  let allDocuments = [];
  let knownDocumentIds = new Set();
  let editingId = null;
  let originalText = "";
  let currentSelectedId = null;

  // --- λίστα εγγράφων (sidebar) ---
  async function loadDocuments() {
    const list = el("docList");
    list.textContent = "Φόρτωση…";
    try {
      const res = await fetch("/documents", { headers: HEADERS });
      const data = await res.json();
      allDocuments = data.documents || [];
      knownDocumentIds = new Set(allDocuments.map(d => d.documentId));
      renderDocList();
    } catch (err) {
      list.textContent = "Σφάλμα φόρτωσης: " + err.message;
    }
  }

  function renderDocList() {
    const list = el("docList");
    const filterVal = el("docFilterInput").value.trim().toLowerCase();
    const filtered = !filterVal
      ? allDocuments
      : allDocuments.filter(d =>
          (d.title || "").toLowerCase().includes(filterVal) ||
          d.documentId.toLowerCase().includes(filterVal)
        );

    if (!filtered.length) {
      list.innerHTML = `<div class="empty-note">${allDocuments.length ? "Κανένα αποτέλεσμα." : "Δεν υπάρχουν έγγραφα ακόμα."}</div>`;
      return;
    }

    list.innerHTML = filtered.map(d => `
      <div class="doc-row${d.documentId === currentSelectedId ? " active" : ""}" data-id="${escapeHtml(d.documentId)}">
        <div class="doc-row-top">
          <strong>${escapeHtml(d.title || d.documentId)}</strong>
          <span class="doc-time">${timeAgo(d.updatedAt)}</span>
        </div>
        <div class="doc-row-preview">${escapeHtml(d.preview || "")}</div>
      </div>
    `).join("");

    list.querySelectorAll(".doc-row").forEach(row => {
      row.addEventListener("click", () => openPreview(row.dataset.id));
    });
  }

  el("docFilterInput").addEventListener("input", renderDocList);

  // --- εύρεση με ελεύθερη περιγραφή (semantic search) ---
  el("docSearchInput").addEventListener("keydown", async (e) => {
    if (e.key !== "Enter") return;
    const query = e.target.value.trim();
    if (!query) return;
    const results = el("docSearchResults");
    results.textContent = "Αναζήτηση…";
    try {
      const res = await fetch("/search-documents", {
        method: "POST",
        headers: HEADERS,
        body: JSON.stringify({ query }),
      });
      const data = await res.json();
      if (!data.documents || !data.documents.length) {
        results.innerHTML = '<div class="empty-note">Κανένα αποτέλεσμα.</div>';
        return;
      }
      results.innerHTML = data.documents.map(d => `
        <div class="search-result-row" data-id="${escapeHtml(d.documentId)}">
          <strong>${escapeHtml(d.title || d.documentId)}</strong>
          <span>${escapeHtml(d.preview)}</span>
        </div>
      `).join("");
      results.querySelectorAll(".search-result-row").forEach(row => {
        row.addEventListener("click", () => openPreview(row.dataset.id));
      });
    } catch (err) {
      results.textContent = "Σφάλμα: " + err.message;
    }
  });

  // --- ερωτήσεις χωρίς απάντηση (Section E) ---
  async function loadFallbackQuestions() {
    const list = el("fallbackList");
    list.textContent = "Φόρτωση…";
    try {
      const res = await fetch("/fallback-questions", { headers: HEADERS });
      const data = await res.json();
      const questions = data.questions || [];
      if (!questions.length) {
        list.innerHTML = '<div class="empty-note">Καμία ερώτηση χωρίς απάντηση.</div>';
        return;
      }
      list.innerHTML = questions.map(q => `
        <div class="fallback-row">
          ${escapeHtml(q.question)}
          <span class="fq-time">${timeAgo(q.timestamp)}</span>
        </div>
      `).join("");
    } catch (err) {
      list.textContent = "Σφάλμα: " + err.message;
    }
  }

  el("refreshFallbackBtn").addEventListener("click", loadFallbackQuestions);

  // --- preview (πρώτο βήμα, πάντα, πριν το edit) ---
  async function openPreview(documentId) {
    currentSelectedId = documentId;
    renderDocList();
    const main = el("mainPanel");
    main.innerHTML = '<div class="empty-note">Φόρτωση…</div>';
    try {
      const res = await fetch(`/document/${encodeURIComponent(documentId)}`, { headers: HEADERS });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Δεν βρέθηκε");
      renderPreviewPanel(data);
    } catch (err) {
      main.innerHTML = `<div class="empty-note">❌ ${escapeHtml(err.message)}</div>`;
    }
  }

  function renderPreviewPanel(data) {
    const main = el("mainPanel");
    const metaParts = [];
    if (data.updatedAt) metaParts.push(`Ενημερώθηκε ${timeAgo(data.updatedAt)}`);
    if (data.chunkCount != null) metaParts.push(`${data.chunkCount} τμήματα`);

    main.innerHTML = `
      <div class="preview-head">
        <h2></h2>
        <div class="preview-meta">
          <span id="previewMetaText"></span>
          <span id="previewSourceLinkWrap"></span>
        </div>
      </div>
      <div class="preview-body"></div>
      <div class="preview-actions">
        <button type="button" id="editFromPreviewBtn">Επεξεργασία</button>
      </div>
    `;
    main.querySelector(".preview-head h2").textContent = data.title || data.documentId;
    el("previewMetaText").textContent = metaParts.join(" · ");
    main.querySelector(".preview-body").textContent = data.text;

    if (data.sourceUrl) {
      const link = document.createElement("a");
      link.href = data.sourceUrl;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = " · Δες live →";
      el("previewSourceLinkWrap").appendChild(link);
    }

    el("editFromPreviewBtn").addEventListener("click", () => enterEditMode(data));
  }

  // --- edit mode (ρητό κλικ, ποτέ αυτόματα) ---
  function enterEditMode(data) {
    editingId = data.documentId;
    originalText = data.text;
    renderEditForm({
      title: data.title || "",
      documentId: data.documentId,
      text: data.text,
      sourceUrl: data.sourceUrl || "",
      isExisting: true,
    });
  }

  function enterNewDocumentMode() {
    editingId = null;
    originalText = "";
    currentSelectedId = null;
    renderDocList();
    renderEditForm({ title: "", documentId: "", text: "", sourceUrl: "", isExisting: false });
  }

  el("newDocBtn").addEventListener("click", enterNewDocumentMode);

  function renderEditForm({ title, documentId, text, sourceUrl, isExisting }) {
    const main = el("mainPanel");
    main.innerHTML = `
      <form class="edit-form" id="editForm">
        <div class="form-header">
          <div class="label">${isExisting ? "Επεξεργασία εγγράφου" : "Νέο έγγραφο"}</div>
          <button type="button" id="cancelEditBtn">Άκυρο</button>
        </div>
        <input type="text" id="docTitle" placeholder="Τίτλος (π.χ. Πολιτική αδειών)" required>
        <div class="slug-hint" id="slugHint"></div>
        <textarea id="docText" required></textarea>
        <div class="upload-limit-hint">Μέγιστο: ~8.000 λέξεις ή 2MB</div>
        <input type="text" id="docSourceUrl" placeholder="sourceUrl (προαιρετικό)">
        <button type="submit" id="uploadBtn">${isExisting ? "Ενημέρωση" : "Ανέβασμα"}</button>
        <div class="upload-status" id="uploadStatus"></div>
      </form>
      <div class="diff-view" id="diffView">
        <div class="diff-text" id="diffText"></div>
        <div class="diff-actions">
          <button type="button" class="diff-confirm" id="diffConfirmBtn">Επιβεβαίωση &amp; Αποθήκευση</button>
          <button type="button" class="diff-back" id="diffBackBtn">← Πίσω για επεξεργασία</button>
        </div>
      </div>
    `;
    el("docTitle").value = title;
    el("docText").value = text;
    el("docSourceUrl").value = sourceUrl;

    if (isExisting) {
      // Υπάρχον έγγραφο -- το documentId είναι ήδη σταθερό, δεν αλλάζει
      // ποτέ ξανά από αλλαγές στον τίτλο. Απλή ενημερωτική γραμμή.
      el("slugHint").textContent = `documentId: ${documentId}`;
    } else {
      // Νέο έγγραφο -- το slug ενημερώνεται ζωντανά καθώς γράφει τον τίτλο.
      const updateHint = () => {
        const slug = slugify(el("docTitle").value);
        el("slugHint").textContent = slug ? `Θα αποθηκευτεί ως: ${slug}` : "";
      };
      el("docTitle").addEventListener("input", updateHint);
      updateHint();
    }

    el("cancelEditBtn").addEventListener("click", () => {
      if (isExisting) openPreview(documentId);
      else {
        el("mainPanel").innerHTML = '<div class="main-placeholder">Επίλεξε ένα έγγραφο από τα αριστερά, ή δημιούργησε νέο.</div>';
      }
    });

    el("editForm").addEventListener("submit", handleFormSubmit);
    el("diffBackBtn").addEventListener("click", () => {
      el("diffView").classList.remove("show");
      el("editForm").style.display = "flex";
    });
    el("diffConfirmBtn").addEventListener("click", async () => {
      const btn = el("diffConfirmBtn");
      btn.disabled = true;
      await doUpload();
      btn.disabled = false;
    });
  }

  // --- word-level diff (LCS), τρέχει εξ ολοκλήρου στον browser ---
  function diffWords(oldText, newText) {
    const oldTokens = oldText.split(/(\s+)/);
    const newTokens = newText.split(/(\s+)/);
    const m = oldTokens.length, n = newTokens.length;
    const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
    for (let i = m - 1; i >= 0; i--) {
      for (let j = n - 1; j >= 0; j--) {
        dp[i][j] = oldTokens[i] === newTokens[j]
          ? dp[i + 1][j + 1] + 1
          : Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
    const ops = [];
    let i = 0, j = 0;
    while (i < m && j < n) {
      if (oldTokens[i] === newTokens[j]) { ops.push({ t: "same", v: oldTokens[i] }); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push({ t: "removed", v: oldTokens[i] }); i++; }
      else { ops.push({ t: "added", v: newTokens[j] }); j++; }
    }
    while (i < m) { ops.push({ t: "removed", v: oldTokens[i++] }); }
    while (j < n) { ops.push({ t: "added", v: newTokens[j++] }); }
    return ops;
  }

  function renderDiff(ops) {
    return ops.map(op => {
      const safe = escapeHtml(op.v);
      if (op.t === "added") return `<ins>${safe}</ins>`;
      if (op.t === "removed") return `<del>${safe}</del>`;
      return safe;
    }).join("");
  }

  // Το documentId δεν το πληκτρολογεί ποτέ ο χρήστης: για υπάρχον έγγραφο
  // είναι το ήδη σταθερό editingId, για νέο παράγεται από τον τίτλο.
  function getFormDocumentId() {
    return editingId || slugify(el("docTitle").value);
  }

  // --- submit: νέο έγγραφο πάει κατευθείαν, υπάρχον δείχνει πρώτα diff ---
  async function handleFormSubmit(e) {
    e.preventDefault();
    const btn = el("uploadBtn");
    const documentId = getFormDocumentId();
    const newText = el("docText").value.trim();

    if (!documentId) {
      el("uploadStatus").textContent = "❌ Γράψε έναν τίτλο πρώτα.";
      return;
    }

    // Δύο διαφορετικά έγγραφα με πολύ παρόμοιο τίτλο θα παράγουν το ίδιο
    // slug -- το αναγνωρίζουμε και δείχνουμε diff αντί για σιωπηλή
    // αντικατάσταση, ακριβώς όπως στην περίπτωση της έμμεσης επεξεργασίας.
    if (!editingId && knownDocumentIds.has(documentId)) {
      btn.disabled = true;
      el("uploadStatus").textContent = "Έλεγχος υπάρχοντος εγγράφου…";
      try {
        const res = await fetch(`/document/${encodeURIComponent(documentId)}`, { headers: HEADERS });
        const data = await res.json();
        if (res.ok) {
          editingId = documentId;
          originalText = data.text;
        }
      } catch (err) {
        // αν αποτύχει ο έλεγχος, συνεχίζουμε ούτως ή άλλως παρακάτω
      }
      el("uploadStatus").textContent = "";
      btn.disabled = false;
    }

    if (!editingId) {
      btn.disabled = true;
      doUpload().finally(() => { btn.disabled = false; });
      return;
    }

    const ops = diffWords(originalText, newText);
    const hasChanges = ops.some(op => op.t !== "same");
    el("diffText").innerHTML = hasChanges
      ? renderDiff(ops)
      : '<div class="diff-nochange">Καμία αλλαγή στο κείμενο.</div>';
    el("editForm").style.display = "none";
    el("diffView").classList.add("show");
  }

  async function doUpload() {
    const documentId = getFormDocumentId();
    const title = el("docTitle").value.trim();
    const text = el("docText").value.trim();
    const sourceUrl = el("docSourceUrl").value.trim();
    const status = el("uploadStatus");

    status.textContent = "Ανέβασμα…";
    try {
      const res = await fetch("/upload", {
        method: "POST",
        headers: HEADERS,
        body: JSON.stringify({ documentId, text, title: title || undefined, sourceUrl: sourceUrl || undefined }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Άγνωστο σφάλμα");

      await loadDocuments();
      openPreview(documentId);
    } catch (err) {
      status.textContent = "❌ " + err.message;
    }
  }

  // --- δοκιμαστικό ερώτημα ---
  // Δείχνουμε την απάντηση μορφοποιημένη, σαν κανονική απάντηση chat --
  // ΟΧΙ raw JSON, που μπερδεύει όποιον δεν είναι προγραμματιστής. Οι
  // τεχνικές λεπτομέρειες (score, chunk index, πλήρες JSON) παραμένουν
  // διαθέσιμες πίσω από ένα προαιρετικό "Τεχνικές λεπτομέρειες".
  el("testQInput").addEventListener("keydown", async (e) => {
    if (e.key !== "Enter") return;
    const question = e.target.value.trim();
    if (!question) return;
    const out = el("testQOutput");
    out.innerHTML = '<div class="empty-note">Φόρτωση…</div>';
    try {
      const res = await fetch("/query", {
        method: "POST",
        headers: HEADERS,
        body: JSON.stringify({ question }),
      });
      const data = await res.json();
      renderTestQResult(data);
      // Ο agent μόλις κατέγραψε αυτό το ερώτημα ως fallback (αν ήταν) --
      // ανανεώνουμε τη λίστα ώστε να το δεις αμέσως, χωρίς χειροκίνητο κλικ.
      if (data.isFallback) loadFallbackQuestions();
    } catch (err) {
      out.innerHTML = `<div class="empty-note">❌ ${escapeHtml(err.message)}</div>`;
    }
  });

  function renderTestQResult(data) {
    const out = el("testQOutput");
    out.innerHTML = `
      <div class="test-q-answer${data.isFallback ? " fallback" : ""}"></div>
      <div class="test-q-meta"></div>
      <details class="test-q-details">
        <summary>Τεχνικές λεπτομέρειες</summary>
        <pre></pre>
      </details>
    `;
    out.querySelector(".test-q-answer").innerHTML = formatAnswer(data.answer);

    const meta = out.querySelector(".test-q-meta");
    if (data.primarySource) {
      const pct = Math.round((data.primarySource.score || 0) * 100);
      meta.textContent = `Πηγή: ${data.primarySource.title || data.primarySource.documentId} · σχετικότητα ${pct}%`;
    }

    out.querySelector("pre").textContent = JSON.stringify(data, null, 2);
  }

  loadDocuments();
  loadFallbackQuestions();
</script>
</body>
</html>
