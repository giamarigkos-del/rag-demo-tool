<!DOCTYPE html>
<html lang="en" data-i18n-doctitle="editorDocTitle">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content Management — Operations Portal</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/shared.css">
<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css">
<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/theme/toastui-editor-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
<style>
  html,body{height:100%;}
  body{display:flex;flex-direction:column;}

  .top-bar{height:56px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);
    display:flex;align-items:center;padding:0 24px;gap:12px;}
  .top-bar strong{font-size:15px;}
  .top-bar .back-link{font-size:11.5px;font-weight:700;color:var(--text);text-decoration:none;
    background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:5px 10px;}
  .top-bar .back-link:hover{background:var(--accent-soft);border-color:var(--accent);}
  .top-bar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .top-bar-right .lang-toggle{margin-left:0;}

  .layout{flex:1;display:flex;min-height:0;}

  .sidebar{width:340px;flex-shrink:0;border-left:1px solid var(--border);background:var(--surface);
    display:flex;flex-direction:column;min-height:0;overflow-y:auto;order:2;}
  .main{order:1;}
  .sidebar-section{padding:14px 16px;}
  .sidebar-section.grow{max-height:300px;overflow-y:auto;flex-shrink:0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
  .label{font-size:11px;color:var(--text-soft);margin-bottom:8px;text-transform:uppercase;letter-spacing:.02em;}
  .label-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .label-row .label{margin-bottom:0;}
  .refresh-btn{border:none;background:none;color:var(--accent);font-size:11.5px;cursor:pointer;padding:0;
    text-transform:none;letter-spacing:0;}
  .refresh-btn:hover{text-decoration:underline;}

  .new-doc-btn{width:100%;border:none;background:var(--accent);color:var(--on-accent);
    border-radius:6px;padding:10px;font-size:13px;cursor:pointer;font-weight:600;}

  .filter-input, .search-input{width:100%;border:1px solid var(--border);border-radius:6px;
    padding:8px 10px;font-size:13px;margin-top:10px;}

  .doc-row{padding:9px 8px;border-radius:6px;cursor:pointer;margin-bottom:2px;}
  .doc-row:hover{background:var(--surface-2);}
  .doc-row.active{background:var(--accent-soft);}
  .doc-row-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .doc-row-top strong{font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .doc-time{font-size:11px;color:var(--text-soft);white-space:nowrap;flex-shrink:0;}
  .doc-row-preview{font-size:12px;color:var(--text-soft);margin-top:2px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .empty-note{font-size:12px;color:var(--text-soft);}

  .status-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;
    border-radius:10px;margin-left:6px;vertical-align:middle;white-space:nowrap;}
  .status-badge.draft{background:var(--warn-bg);color:var(--warn-border);border:1px solid var(--warn-border);}
  .status-badge.deleted{background:rgba(229,100,107,.12);color:var(--danger);border:1px solid var(--danger);}
  .status-badge.expiry{background:var(--surface-2);color:var(--text-soft);border:1px solid var(--border);font-weight:600;}

  .deleted-toggle{border:none;background:none;color:var(--accent);font-size:11.5px;cursor:pointer;
    padding:8px 0 0;text-align:left;width:100%;}
  .deleted-toggle:hover{text-decoration:underline;}
  .deleted-row{font-size:12.5px;padding:7px 6px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .deleted-row:last-child{border-bottom:none;}
  .deleted-row span{color:var(--text-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .deleted-row button{border:1px solid var(--border);background:var(--surface-2);color:var(--text);
    border-radius:4px;padding:4px 9px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .deleted-row button:hover{border-color:var(--accent);background:var(--accent-soft);}

  .search-result-row{font-size:12.5px;padding:7px 6px;border-radius:6px;cursor:pointer;}
  .search-result-row:hover{background:var(--surface-2);}
  .search-result-row strong{display:block;color:var(--text);font-size:12.5px;}
  .search-result-row span{color:var(--text-soft);}
  .search-results{margin-top:8px;max-height:220px;overflow-y:auto;}

  .fallback-row{font-size:12.5px;padding:7px 6px;border-bottom:1px solid var(--border);color:var(--text);
    line-height:1.5;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .fallback-row:last-child{border-bottom:none;}
  .fallback-row-text{flex:1;min-width:0;}
  .fq-time{font-size:11px;color:var(--text-soft);display:block;margin-top:2px;}
  .fallback-dismiss{flex-shrink:0;width:20px;height:20px;border-radius:50%;
    border:1px solid var(--border);background:var(--surface-2);color:var(--text-soft);
    font-size:11px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
    padding:0;margin-top:1px;}
  .fallback-dismiss:hover{background:var(--danger);border-color:var(--danger);color:var(--on-accent);}
  .fallback-dismiss:disabled{opacity:.5;cursor:default;}
  .fallback-list{max-height:220px;overflow-y:auto;}

  .test-q{padding:14px 16px;flex-shrink:0;}
  .test-q input{width:100%;border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:12px;margin-top:4px;}
  .test-q-answer{font-size:12.5px;line-height:1.6;background:var(--surface-2);border:1px solid var(--border);
    border-radius:6px;padding:10px;margin-top:8px;max-height:180px;overflow-y:auto;}
  .test-q-answer.fallback{border-color:var(--warn-border);background:var(--warn-bg);}
  .test-q-meta{font-size:11px;color:var(--text-soft);margin-top:6px;}
  .test-q-details{margin-top:8px;}
  .test-q-details summary{font-size:11px;color:var(--text-soft);cursor:pointer;}
  .test-q-details pre{font-size:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;
    padding:8px;margin-top:6px;max-height:160px;overflow:auto;white-space:pre-wrap;word-break:break-word;}

  .main{flex:1;overflow-y:auto;padding:32px 40px;min-width:0;}
  .main-placeholder{color:var(--text-soft);font-size:14px;margin-top:60px;text-align:center;}

  .doc-browser-head{display:flex;align-items:center;justify-content:space-between;
    margin-bottom:18px;gap:16px;flex-wrap:wrap;}
  .doc-browser-head h2{font-size:20px;margin:0;}
  .doc-browser-search{flex:1;max-width:320px;border:1px solid var(--border);border-radius:6px;
    padding:8px 10px;font-size:13px;font-family:inherit;}
  .doc-browser-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));gap:14px;}
  .doc-browser-card{display:block;width:100%;text-align:left;background:var(--surface);
    border:1px solid var(--border);border-radius:8px;padding:16px;cursor:pointer;font-family:inherit;
    transition:border-color .15s;}
  .doc-browser-card:hover{border-color:var(--accent);}
  .doc-browser-card h3{font-size:14.5px;margin:0 0 6px;color:var(--text);display:flex;align-items:center;gap:6px;}
  .doc-browser-card-date{font-size:11.5px;color:var(--text-soft);display:block;margin-bottom:8px;}
  .doc-browser-card-preview{font-size:12.5px;line-height:1.6;color:var(--text-soft);
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}

  .back-to-browser-btn{border:none;background:none;color:var(--accent);font-size:12.5px;
    cursor:pointer;padding:0;margin-bottom:14px;font-family:inherit;font-weight:600;}
  .back-to-browser-btn:hover{text-decoration:underline;}
  .preview-head h2{font-size:22px;margin:0 0 6px;}
  .preview-meta{font-size:12.5px;color:var(--text-soft);margin-bottom:20px;}
  .preview-meta a{color:var(--accent);}
  .preview-body{font-size:14.5px;line-height:1.8;max-width:760px;
    border:1px solid var(--border);border-radius:8px;padding:20px;background:var(--surface);}
  .preview-actions{margin-top:20px;display:flex;gap:10px;}
  .preview-actions button{border:none;background:var(--accent);color:var(--on-accent);
    border-radius:6px;padding:9px 18px;font-size:13px;cursor:pointer;font-weight:600;}
  .preview-actions button.btn-danger{background:none;border:1px solid var(--danger);color:var(--danger);}
  .preview-actions button.btn-danger:hover{background:var(--danger);color:var(--on-accent);}

  .edit-form{display:flex;flex-direction:column;gap:8px;max-width:760px;}
  .form-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .form-header .label{margin-bottom:0;}
  .form-header button{border:none;background:none;color:var(--text-soft);font-size:12px;
    cursor:pointer;text-decoration:underline;}
  .edit-form input, .edit-form textarea{border:1px solid var(--border);border-radius:6px;
    padding:9px 10px;font-size:13.5px;width:100%;}
  .edit-form input:disabled{background:var(--surface-2);color:var(--text-soft);}

  #tuiEditor{margin-bottom:2px;}

  .live-preview-label{font-size:11px;color:var(--text-soft);text-transform:uppercase;
    letter-spacing:.02em;margin-top:2px;}
  .live-preview{font-size:14px;line-height:1.75;border:1px solid var(--border);border-radius:8px;
    padding:16px;background:var(--surface);min-height:100px;}
  /* Το placeholder κείμενο ("Η προεπισκόπηση θα εμφανιστεί...") περνάει από
     CSS custom property αντί για hardcoded content, ώστε να μπορεί να το
     αλλάζει το JS ανάλογα με τη γλώσσα (βλ. applyLivePreviewEmptyText()). */
  .live-preview:empty::before{content:var(--live-preview-empty-text, "");color:var(--text-soft);}
  .edit-form button[type="submit"]{border:none;background:var(--accent);color:var(--on-accent);
    border-radius:6px;padding:10px 18px;font-size:13px;cursor:pointer;align-self:flex-start;font-weight:600;}
  .edit-form button:disabled{opacity:.5;cursor:default;}
  .upload-status{font-size:12px;color:var(--text-soft);}

  .diff-view{display:none;flex-direction:column;gap:10px;max-width:760px;}
  .diff-view.show{display:flex;}
  .diff-text{font-size:13.5px;line-height:1.7;border:1px solid var(--border);
    border-radius:8px;padding:16px;background:var(--surface-2);white-space:pre-wrap;}
  .diff-text ins{background:rgba(62,107,87,.18);color:var(--text);text-decoration:none;border-radius:2px;}
  .diff-text del{background:rgba(163,64,47,.14);color:var(--text-soft);text-decoration:line-through;border-radius:2px;}
  .diff-actions{display:flex;gap:10px;}
  .diff-actions button{border:none;border-radius:6px;padding:10px 18px;font-size:13px;cursor:pointer;font-weight:600;}
  .diff-confirm{background:var(--accent);color:var(--on-accent);}
  .diff-back{background:none;border:1px solid var(--border) !important;color:var(--text);}
  .diff-nochange{font-size:13px;color:var(--text-soft);}

  .slug-hint{font-size:11.5px;color:var(--text-soft);margin-top:-2px;}
  .upload-limit-hint{font-size:11.5px;color:var(--text-soft);margin-top:-2px;}

  /* Σε στενές οθόνες, το sidebar (σταθερό πλάτος) σπρώχνει το main panel
     εκτός οθόνης -- εδώ το κύριο panel πάει ΚΑΤΩ από το sidebar αντί
     να εξαφανίζεται. */
  @media (max-width: 900px){
    .layout{flex-direction:column;}
    .sidebar{width:100%;border-left:none;border-bottom:1px solid var(--border);order:1;}
    .main{order:2;}
    .sidebar-section.grow{max-height:280px;}
    .main{padding:20px;}
  }
</style>
</head>
<body>

  <div class="top-bar">
    <strong data-i18n="editorHeading">Content Management</strong>
    <div class="top-bar-right">
      <a class="back-link" id="switchModeLink" href="#" data-i18n="switchMode">Switch mode</a>
      <a class="back-link" href="/">←Portal</a>
      <div class="lang-toggle" id="langToggle">
        <button type="button" class="lang-btn" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="el">GR</button>
      </div>
    </div>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-section">
        <button class="new-doc-btn" id="newDocBtn" data-i18n="newDoc">+ New document</button>
        <input type="text" class="filter-input" id="docFilterInput" data-i18n-placeholder="filterByTitle" placeholder="Filter by title…">
      </div>
      <div class="sidebar-section grow">
        <div class="label-row">
          <div class="label" data-i18n="documentsLabel">Documents</div>
          <button type="button" class="refresh-btn" id="allDocsBtn" data-i18n="allDocs">All documents</button>
        </div>
        <div id="docList" data-i18n="loading">Loading…</div>
        <button type="button" class="deleted-toggle" id="deletedToggleBtn" style="display:none;"></button>
        <div id="deletedList" style="display:none;"></div>
      </div>
      <div class="sidebar-section">
        <div class="label" data-i18n="searchByDescription">Find by description</div>
        <input type="text" class="search-input" id="docSearchInput" data-i18n-placeholder="searchExamplePlaceholder" placeholder="e.g. Billing's working hours…">
        <div id="docSearchResults" class="search-results"></div>
      </div>
      <div class="test-q">
        <div class="label" data-i18n="testQuestion">Test question</div>
        <input type="text" id="testQInput" data-i18n-placeholder="testQuestionPlaceholder" placeholder="e.g. What's the approval limit?">
        <div id="testQOutput"></div>
      </div>
      <div class="sidebar-section">
        <div class="label-row">
          <div class="label" data-i18n="unansweredQuestions">Unanswered questions</div>
          <button type="button" class="refresh-btn" id="refreshFallbackBtn" data-i18n="refresh">↻ Refresh</button>
        </div>
        <div id="fallbackList" class="fallback-list" data-i18n="loading">Loading…</div>
      </div>
    </div>

    <div class="main" id="mainPanel">
      <div class="main-placeholder" data-i18n="loading">Loading…</div>
    </div>
  </div>

<script src="/shared.js"></script>
<script>
  const el = (id) => document.getElementById(id);

  applyTranslations();
  initLangToggle("langToggle");

  // Το CSS custom property για το placeholder κείμενο του live preview
  // (βλ. σχόλιο δίπλα στο .live-preview:empty::before) -- JSON.stringify
  // παράγει ακριβώς τη σωστή CSS string σύνταξη (με τα εισαγωγικά).
  document.documentElement.style.setProperty(
    "--live-preview-empty-text",
    JSON.stringify(t("livePreviewEmpty"))
  );

  let allDocuments = [];
  let knownDocumentIds = new Set();
  let editingId = null;
  let originalText = "";
  let currentSelectedId = null;
  let tuiEditorInstance = null;

  // --- λίστα εγγράφων (sidebar) ---
  async function loadDocuments() {
    const list = el("docList");
    list.textContent = t("loading");
    try {
      const res = await fetch("/documents", { headers: HEADERS });
      const data = await res.json();
      allDocuments = data.documents || [];
      knownDocumentIds = new Set(allDocuments.map(d => d.documentId));
      renderDocList();
    } catch (err) {
      list.textContent = t("loadErrorPrefix") + err.message;
    }
  }

  // --- Browser εγγράφων στο κεντρικό panel -- αντικαθιστά το άδειο
  // "Επίλεξε ένα έγγραφο..." όταν δεν υπάρχει επιλεγμένο έγγραφο. Ίδιο
  // οπτικό στυλ με το "Πρόσφατα έγγραφα" grid του δημόσιου Portal, αλλά με
  // δική του αναζήτηση και ΟΛΑ τα έγγραφα (πρόχειρα + δημοσιευμένα, όχι
  // διαγραμμένα) -- έτσι λύνεται εύκολα η επιλογή όταν υπάρχουν πολλά.
  function renderDocBrowser() {
    const main = el("mainPanel");
    const docs = allDocuments.filter(d => d.status !== "deleted");

    main.innerHTML = `
      <div class="doc-browser-head">
        <h2>${t("allDocs")}</h2>
        <input type="text" class="doc-browser-search" id="docBrowserSearch" placeholder="${escapeHtml(t("filterByTitle"))}">
      </div>
      <div class="doc-browser-grid" id="docBrowserGrid"></div>
    `;

    function renderGrid() {
      const filterVal = el("docBrowserSearch").value.trim().toLowerCase();
      const filtered = !filterVal
        ? docs
        : docs.filter(d =>
            (d.title || "").toLowerCase().includes(filterVal) ||
            d.documentId.toLowerCase().includes(filterVal)
          );
      const grid = el("docBrowserGrid");
      if (!filtered.length) {
        grid.innerHTML = `<div class="empty-note">${docs.length ? t("noResults") : t("noDocsYet")}</div>`;
        return;
      }
      grid.innerHTML = filtered.map(d => `
        <button type="button" class="doc-browser-card" data-id="${escapeHtml(d.documentId)}">
          <h3>${escapeHtml(d.title || d.documentId)}${d.status === "draft" ? `<span class="status-badge draft">${t("draftBadge")}</span>` : ""}${expiryLabel(d.expiresAt) ? `<span class="status-badge expiry">${expiryLabel(d.expiresAt)}</span>` : ""}</h3>
          <span class="doc-browser-card-date">${t("updatedPrefix")} ${timeAgo(d.updatedAt)}</span>
          <div class="doc-browser-card-preview">${escapeHtml(d.preview || "")}</div>
        </button>
      `).join("");
      grid.querySelectorAll(".doc-browser-card").forEach(card => {
        card.addEventListener("click", () => openPreview(card.dataset.id));
      });
    }

    el("docBrowserSearch").addEventListener("input", renderGrid);
    renderGrid();
  }

  function renderDocList() {
    const list = el("docList");
    const filterVal = el("docFilterInput").value.trim().toLowerCase();
    // Section D: τα διαγραμμένα δεν εμφανίζονται εδώ -- έχουν το δικό τους
    // ξεχωριστό, κρυμμένο section παρακάτω (βλ. renderDeletedList).
    const visibleDocs = allDocuments.filter(d => d.status !== "deleted");
    const filtered = !filterVal
      ? visibleDocs
      : visibleDocs.filter(d =>
          (d.title || "").toLowerCase().includes(filterVal) ||
          d.documentId.toLowerCase().includes(filterVal)
        );

    if (!filtered.length) {
      list.innerHTML = `<div class="empty-note">${visibleDocs.length ? t("noResults") : t("noDocsYet")}</div>`;
    } else {
      list.innerHTML = filtered.map(d => `
        <div class="doc-row${d.documentId === currentSelectedId ? " active" : ""}" data-id="${escapeHtml(d.documentId)}">
          <div class="doc-row-top">
            <strong>${escapeHtml(d.title || d.documentId)}</strong>
            <span class="doc-time">${timeAgo(d.updatedAt)}</span>
          </div>
          <div class="doc-row-preview">${escapeHtml(d.preview || "")}${d.status === "draft" ? `<span class="status-badge draft">${t("draftBadge")}</span>` : ""}${expiryLabel(d.expiresAt) ? `<span class="status-badge expiry">${expiryLabel(d.expiresAt)}</span>` : ""}</div>
        </div>
      `).join("");

      list.querySelectorAll(".doc-row").forEach(row => {
        row.addEventListener("click", () => openPreview(row.dataset.id));
      });
    }

    renderDeletedList();
  }

  // --- Section D: διαγραμμένα (soft-deleted) -- κρυμμένα by default,
  // με ένα toggle link για να τα δεις/τα επαναφέρεις ---
  let showDeleted = false;

  function renderDeletedList() {
    const deleted = allDocuments.filter(d => d.status === "deleted");
    const toggleBtn = el("deletedToggleBtn");
    const listEl = el("deletedList");

    if (!deleted.length) {
      toggleBtn.style.display = "none";
      listEl.style.display = "none";
      return;
    }

    toggleBtn.style.display = "block";
    toggleBtn.textContent = t(showDeleted ? "deletedToggleHide" : "deletedToggleShow", { count: deleted.length });
    listEl.style.display = showDeleted ? "block" : "none";

    if (showDeleted) {
      listEl.innerHTML = deleted.map(d => `
        <div class="deleted-row" data-id="${escapeHtml(d.documentId)}">
          <span>${escapeHtml(d.title || d.documentId)}</span>
          <button type="button" class="restore-btn" data-id="${escapeHtml(d.documentId)}">${t("restore")}</button>
        </div>
      `).join("");

      listEl.querySelectorAll(".restore-btn").forEach(btn => {
        btn.addEventListener("click", () => restoreDocument(btn.dataset.id));
      });
    }
  }

  el("deletedToggleBtn").addEventListener("click", () => {
    showDeleted = !showDeleted;
    renderDeletedList();
  });

  async function restoreDocument(documentId) {
    try {
      const res = await fetch(`/document/${encodeURIComponent(documentId)}/restore`, {
        method: "POST",
        headers: HEADERS,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || t("notFoundDefault"));
      await loadDocuments();
    } catch (err) {
      alert(t("restoreErrorPrefix") + err.message);
    }
  }

  el("docFilterInput").addEventListener("input", renderDocList);

  // --- εύρεση με ελεύθερη περιγραφή (semantic search) ---
  el("docSearchInput").addEventListener("keydown", async (e) => {
    if (e.key !== "Enter") return;
    const query = e.target.value.trim();
    if (!query) return;
    const results = el("docSearchResults");
    results.textContent = t("searching");
    try {
      const res = await fetch("/search-documents", {
        method: "POST",
        headers: HEADERS,
        body: JSON.stringify({ query }),
      });
      const data = await res.json();
      if (!data.documents || !data.documents.length) {
        results.innerHTML = `<div class="empty-note">${t("noResults")}</div>`;
        return;
      }
      results.innerHTML = data.documents.map(d => `
        <div class="search-result-row" data-id="${escapeHtml(d.documentId)}">
          <strong>${escapeHtml(d.title || d.documentId)}</strong>
          <span>${escapeHtml(d.preview)}</span>
        </div>
      `).join("");
      results.querySelectorAll(".search-result-row").forEach(row => {
        row.addEventListener("click", () => openPreview(row.dataset.id));
      });
    } catch (err) {
      results.textContent = t("genericErrorPrefix") + err.message;
    }
  });

  // --- ερωτήσεις χωρίς απάντηση (Section E) ---
  async function loadFallbackQuestions() {
    const list = el("fallbackList");
    list.textContent = t("loading");
    try {
      const res = await fetch("/fallback-questions", { headers: HEADERS });
      const data = await res.json();
      const questions = data.questions || [];
      if (!questions.length) {
        list.innerHTML = `<div class="empty-note">${t("noUnansweredQuestions")}</div>`;
        return;
      }
      list.innerHTML = questions.map(q => `
        <div class="fallback-row" data-id="${escapeHtml(q.id)}">
          <div class="fallback-row-text">
            ${escapeHtml(q.question)}
            <span class="fq-time">${timeAgo(q.timestamp)}</span>
          </div>
          <button type="button" class="fallback-dismiss" title="${escapeHtml(t("deleteActionLabel"))}" aria-label="${escapeHtml(t("deleteActionLabel"))}">✕</button>
        </div>
      `).join("");

      list.querySelectorAll(".fallback-dismiss").forEach(btn => {
        btn.addEventListener("click", async () => {
          const row = btn.closest(".fallback-row");
          const id = row.dataset.id;
          btn.disabled = true;
          try {
            const delRes = await fetch(`/fallback-questions/${encodeURIComponent(id)}`, {
              method: "DELETE",
              headers: HEADERS,
            });
            if (!delRes.ok) throw new Error(t("notFoundDefault"));
            row.remove();
            if (!list.querySelector(".fallback-row")) {
              list.innerHTML = `<div class="empty-note">${t("noUnansweredQuestions")}</div>`;
            }
          } catch (err) {
            alert(t("deleteErrorPrefix") + err.message);
            btn.disabled = false;
          }
        });
      });
    } catch (err) {
      list.textContent = t("genericErrorPrefix") + err.message;
    }
  }

  el("refreshFallbackBtn").addEventListener("click", loadFallbackQuestions);

  // --- preview (πρώτο βήμα, πάντα, πριν το edit) ---
  async function openPreview(documentId) {
    if (tuiEditorInstance) { tuiEditorInstance.destroy(); tuiEditorInstance = null; }
    currentSelectedId = documentId;
    renderDocList();
    const main = el("mainPanel");
    main.innerHTML = `<div class="empty-note">${t("loading")}</div>`;
    try {
      const res = await fetch(`/document/${encodeURIComponent(documentId)}`, { headers: HEADERS });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || t("notFoundDefault"));
      renderPreviewPanel(data);
    } catch (err) {
      main.innerHTML = `<div class="empty-note">❌ ${escapeHtml(err.message)}</div>`;
    }
  }

  function renderPreviewPanel(data) {
    const main = el("mainPanel");
    const metaParts = [];
    if (data.updatedAt) metaParts.push(`${t("updatedPrefix")} ${timeAgo(data.updatedAt)}`);
    if (data.chunkCount != null) metaParts.push(t("chunksCountSuffix", { count: data.chunkCount }));
    if (expiryLabel(data.expiresAt)) metaParts.push(expiryLabel(data.expiresAt));

    const isDraft = data.status === "draft";

    main.innerHTML = `
      <button type="button" class="back-to-browser-btn" id="backToBrowserBtn">${t("backToAllDocs")}</button>
      <div class="preview-head">
        <h2></h2>
        <div class="preview-meta">
          <span id="previewMetaText"></span>
          <span id="previewSourceLinkWrap"></span>
        </div>
      </div>
      <div class="preview-body md-content"></div>
      <div class="preview-actions">
        <button type="button" id="editFromPreviewBtn">${t("edit")}</button>
        ${isDraft ? `<button type="button" id="publishBtn">${t("publish")}</button>` : ""}
        <button type="button" class="btn-danger" id="deleteBtn">${t("delete")}</button>
      </div>
    `;
    el("backToBrowserBtn").addEventListener("click", () => {
      currentSelectedId = null;
      renderDocList();
      renderDocBrowser();
    });
    main.querySelector(".preview-head h2").innerHTML =
      escapeHtml(data.title || data.documentId) +
      (isDraft ? `<span class="status-badge draft">${t("draftBadge")}</span>` : "");
    el("previewMetaText").textContent = metaParts.join(" · ");
    main.querySelector(".preview-body").innerHTML = renderMarkdown(data.text || "");

    if (data.sourceUrl) {
      const link = document.createElement("a");
      link.href = data.sourceUrl;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = t("viewLiveLink");
      el("previewSourceLinkWrap").appendChild(link);
    }

    el("editFromPreviewBtn").addEventListener("click", () => enterEditMode(data));

    if (isDraft) {
      el("publishBtn").addEventListener("click", async () => {
        const btn = el("publishBtn");
        btn.disabled = true;
        btn.textContent = t("publishing");
        try {
          const res = await fetch(`/document/${encodeURIComponent(data.documentId)}/publish`, {
            method: "POST",
            headers: HEADERS,
          });
          const result = await res.json();
          if (!res.ok) throw new Error(result.error || t("notFoundDefault"));
          await loadDocuments();
          openPreview(data.documentId);
        } catch (err) {
          alert(t("publishErrorPrefix") + err.message);
          btn.disabled = false;
          btn.textContent = t("publish");
        }
      });
    }

    el("deleteBtn").addEventListener("click", async () => {
      if (!confirm(t("confirmDeleteDoc", { title: data.title || data.documentId }))) return;
      const btn = el("deleteBtn");
      btn.disabled = true;
      try {
        const res = await fetch(`/document/${encodeURIComponent(data.documentId)}/delete`, {
          method: "POST",
          headers: HEADERS,
        });
        const result = await res.json();
        if (!res.ok) throw new Error(result.error || t("notFoundDefault"));
        currentSelectedId = null;
        await loadDocuments();
        renderDocBrowser();
      } catch (err) {
        alert(t("deleteErrorPrefix") + err.message);
        btn.disabled = false;
      }
    });
  }

  // --- edit mode (ρητό κλικ, ποτέ αυτόματα) ---
  function enterEditMode(data) {
    editingId = data.documentId;
    originalText = data.text;
    renderEditForm({
      title: data.title || "",
      documentId: data.documentId,
      text: data.text,
      sourceUrl: data.sourceUrl || "",
      isExisting: true,
    });
  }

  function enterNewDocumentMode() {
    editingId = null;
    originalText = "";
    currentSelectedId = null;
    renderDocList();
    renderEditForm({ title: "", documentId: "", text: "", sourceUrl: "", isExisting: false });
  }

  el("newDocBtn").addEventListener("click", enterNewDocumentMode);

  el("allDocsBtn").addEventListener("click", () => {
    if (tuiEditorInstance) { tuiEditorInstance.destroy(); tuiEditorInstance = null; }
    currentSelectedId = null;
    renderDocList();
    renderDocBrowser();
  });

  function renderEditForm({ title, documentId, text, sourceUrl, isExisting }) {
    const main = el("mainPanel");
    main.innerHTML = `
      <form class="edit-form" id="editForm">
        <div class="form-header">
          <div class="label">${isExisting ? t("editDocTitle") : t("newDocTitle")}</div>
          <button type="button" id="cancelEditBtn">${t("cancel")}</button>
        </div>
        <input type="text" id="docTitle" placeholder="${escapeHtml(t("titlePlaceholder"))}" required>
        <div class="slug-hint" id="slugHint"></div>
        <div id="tuiEditor"></div>
        <div class="upload-limit-hint">${t("uploadLimitHint")}</div>
        <div class="live-preview-label">${t("previewLabel")}</div>
        <div class="live-preview md-content" id="livePreview"></div>
        <input type="text" id="docSourceUrl" placeholder="${escapeHtml(t("sourceUrlPlaceholder"))}">
        <button type="submit" id="uploadBtn">${isExisting ? t("updateBtn") : t("saveAsDraftBtn")}</button>
        ${isExisting ? "" : `<div class="upload-limit-hint">${t("saveDraftHint")}</div>`}
        <div class="upload-status" id="uploadStatus"></div>
      </form>
      <div class="diff-view" id="diffView">
        <div class="diff-text" id="diffText"></div>
        <div class="diff-actions">
          <button type="button" class="diff-confirm" id="diffConfirmBtn">${t("confirmAndSave")}</button>
          <button type="button" class="diff-back" id="diffBackBtn">${t("backToEdit")}</button>
        </div>
      </div>
    `;
    el("docTitle").value = title;
    el("docSourceUrl").value = sourceUrl;

    // --- WYSIWYG: TOAST UI Editor -- ο χρήστης βλέπει το κείμενο ήδη
    // μορφοποιημένο ενώ γράφει (bold/λίστες/επικεφαλίδες/πίνακες/links/κ.λπ.),
    // χωρίς να χρειάζεται να ξέρει markdown syntax. Αποθηκεύει πάντα markdown
    // από πίσω (getMarkdown()) -- καμία αλλαγή στο πώς σώζουμε/κάνουμε diff.
    if (tuiEditorInstance) {
      tuiEditorInstance.destroy();
      tuiEditorInstance = null;
    }
    const livePreviewEl = el("livePreview");
    const updatePreview = () => {
      livePreviewEl.innerHTML = renderMarkdown(tuiEditorInstance.getMarkdown());
    };
    tuiEditorInstance = new toastui.Editor({
      el: el("tuiEditor"),
      height: "420px",
      initialEditType: "wysiwyg",
      previewStyle: "vertical",
      initialValue: text || "",
      theme: "dark",
      usageStatistics: false,
      hideModeSwitch: true,
    });
    tuiEditorInstance.on("change", updatePreview);
    updatePreview();

    if (isExisting) {
      // Υπάρχον έγγραφο -- το documentId είναι ήδη σταθερό, δεν αλλάζει
      // ποτέ ξανά από αλλαγές στον τίτλο. Απλή ενημερωτική γραμμή (τεχνικός
      // όρος -- δεν μεταφράζεται, ίδιος και στις δύο γλώσσες).
      el("slugHint").textContent = `documentId: ${documentId}`;
    } else {
      // Νέο έγγραφο -- το slug ενημερώνεται ζωντανά καθώς γράφει τον τίτλο.
      const updateHint = () => {
        const slug = slugify(el("docTitle").value);
        el("slugHint").textContent = slug ? t("willBeSavedAs", { slug }) : "";
      };
      el("docTitle").addEventListener("input", updateHint);
      updateHint();
    }

    el("cancelEditBtn").addEventListener("click", () => {
      if (tuiEditorInstance) { tuiEditorInstance.destroy(); tuiEditorInstance = null; }
      if (isExisting) openPreview(documentId);
      else {
        currentSelectedId = null;
        renderDocList();
        renderDocBrowser();
      }
    });

    el("editForm").addEventListener("submit", handleFormSubmit);
    el("diffBackBtn").addEventListener("click", () => {
      el("diffView").classList.remove("show");
      el("editForm").style.display = "flex";
    });
    el("diffConfirmBtn").addEventListener("click", async () => {
      const btn = el("diffConfirmBtn");
      btn.disabled = true;
      await doUpload();
      btn.disabled = false;
    });
  }

  // --- word-level diff (LCS), τρέχει εξ ολοκλήρου στον browser ---
  function diffWords(oldText, newText) {
    const oldTokens = oldText.split(/(\s+)/);
    const newTokens = newText.split(/(\s+)/);
    const m = oldTokens.length, n = newTokens.length;
    const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
    for (let i = m - 1; i >= 0; i--) {
      for (let j = n - 1; j >= 0; j--) {
        dp[i][j] = oldTokens[i] === newTokens[j]
          ? dp[i + 1][j + 1] + 1
          : Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
    const ops = [];
    let i = 0, j = 0;
    while (i < m && j < n) {
      if (oldTokens[i] === newTokens[j]) { ops.push({ t: "same", v: oldTokens[i] }); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push({ t: "removed", v: oldTokens[i] }); i++; }
      else { ops.push({ t: "added", v: newTokens[j] }); j++; }
    }
    while (i < m) { ops.push({ t: "removed", v: oldTokens[i++] }); }
    while (j < n) { ops.push({ t: "added", v: newTokens[j++] }); }
    return ops;
  }

  function renderDiff(ops) {
    return ops.map(op => {
      const safe = escapeHtml(op.v);
      if (op.t === "added") return `<ins>${safe}</ins>`;
      if (op.t === "removed") return `<del>${safe}</del>`;
      return safe;
    }).join("");
  }

  // Το documentId δεν το πληκτρολογεί ποτέ ο χρήστης: για υπάρχον έγγραφο
  // είναι το ήδη σταθερό editingId, για νέο παράγεται από τον τίτλο.
  function getFormDocumentId() {
    return editingId || slugify(el("docTitle").value);
  }

  // --- submit: νέο έγγραφο πάει κατευθείαν, υπάρχον δείχνει πρώτα diff ---
  async function handleFormSubmit(e) {
    e.preventDefault();
    const btn = el("uploadBtn");
    const documentId = getFormDocumentId();
    const newText = tuiEditorInstance.getMarkdown().trim();

    if (!documentId) {
      el("uploadStatus").textContent = t("needTitleError");
      return;
    }

    // Δύο διαφορετικά έγγραφα με πολύ παρόμοιο τίτλο θα παράγουν το ίδιο
    // slug -- το αναγνωρίζουμε και δείχνουμε diff αντί για σιωπηλή
    // αντικατάσταση, ακριβώς όπως στην περίπτωση της έμμεσης επεξεργασίας.
    if (!editingId && knownDocumentIds.has(documentId)) {
      btn.disabled = true;
      el("uploadStatus").textContent = t("checkingExistingDoc");
      try {
        const res = await fetch(`/document/${encodeURIComponent(documentId)}`, { headers: HEADERS });
        const data = await res.json();
        if (res.ok) {
          editingId = documentId;
          originalText = data.text;
        }
      } catch (err) {
        // αν αποτύχει ο έλεγχος, συνεχίζουμε ούτως ή άλλως παρακάτω
      }
      el("uploadStatus").textContent = "";
      btn.disabled = false;
    }

    if (!editingId) {
      btn.disabled = true;
      doUpload().finally(() => { btn.disabled = false; });
      return;
    }

    const ops = diffWords(originalText, newText);
    const hasChanges = ops.some(op => op.t !== "same");
    el("diffText").innerHTML = hasChanges
      ? renderDiff(ops)
      : `<div class="diff-nochange">${t("noTextChanges")}</div>`;
    el("editForm").style.display = "none";
    el("diffView").classList.add("show");
  }

  async function doUpload() {
    const documentId = getFormDocumentId();
    const title = el("docTitle").value.trim();
    const text = tuiEditorInstance.getMarkdown().trim();
    const sourceUrl = el("docSourceUrl").value.trim();
    const status = el("uploadStatus");

    status.textContent = t("uploading");
    try {
      const res = await fetch("/upload", {
        method: "POST",
        headers: HEADERS,
        body: JSON.stringify({ documentId, text, title: title || undefined, sourceUrl: sourceUrl || undefined }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || t("notFoundDefault"));

      if (tuiEditorInstance) { tuiEditorInstance.destroy(); tuiEditorInstance = null; }
      await loadDocuments();
      openPreview(documentId);
    } catch (err) {
      status.textContent = "❌ " + err.message;
    }
  }

  // --- δοκιμαστικό ερώτημα ---
  // Δείχνουμε την απάντηση μορφοποιημένη, σαν κανονική απάντηση chat --
  // ΟΧΙ raw JSON, που μπερδεύει όποιον δεν είναι προγραμματιστής. Οι
  // τεχνικές λεπτομέρειες (score, chunk index, πλήρες JSON) παραμένουν
  // διαθέσιμες πίσω από ένα προαιρετικό "Τεχνικές λεπτομέρειες".
  el("testQInput").addEventListener("keydown", async (e) => {
    if (e.key !== "Enter") return;
    const question = e.target.value.trim();
    if (!question) return;
    const out = el("testQOutput");
    out.innerHTML = `<div class="empty-note">${t("loading")}</div>`;
    try {
      const res = await fetch("/query", {
        method: "POST",
        headers: HEADERS,
        body: JSON.stringify({ question }),
      });
      const data = await res.json();
      renderTestQResult(data);
      // Ο agent μόλις κατέγραψε αυτό το ερώτημα ως fallback (αν ήταν) --
      // ανανεώνουμε τη λίστα ώστε να το δεις αμέσως, χωρίς χειροκίνητο κλικ.
      if (data.isFallback) loadFallbackQuestions();
    } catch (err) {
      out.innerHTML = `<div class="empty-note">❌ ${escapeHtml(err.message)}</div>`;
    }
  });

  function renderTestQResult(data) {
    const out = el("testQOutput");
    out.innerHTML = `
      <div class="test-q-answer${data.isFallback ? " fallback" : ""}"></div>
      <div class="test-q-meta"></div>
      <details class="test-q-details">
        <summary>${t("technicalDetails")}</summary>
        <pre></pre>
      </details>
    `;
    out.querySelector(".test-q-answer").innerHTML = formatAnswer(data.answer);

    const meta = out.querySelector(".test-q-meta");
    if (data.primarySource) {
      const pct = Math.round((data.primarySource.score || 0) * 100);
      meta.textContent = t("sourceScoreLabel", { title: data.primarySource.title || data.primarySource.documentId, pct });
    }

    out.querySelector("pre").textContent = JSON.stringify(data, null, 2);
  }

  loadDocuments().then(renderDocBrowser);
  loadFallbackQuestions();

  el("switchModeLink").addEventListener("click", (e) => {
    e.preventDefault();
    localStorage.removeItem("workspaceId");
    window.location.href = "/landing.html";
  });
</script>
</body>
